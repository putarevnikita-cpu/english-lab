<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263b85"><link rel="manifest" href="manifest.webmanifest"><title>English Lab</title><style>body{font-family:system-ui,sans-serif;background:#eef2ff;color:#18244d;margin:0}header{background:#263b85;color:white;padding:22px}main{max-width:760px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:white}button{border:0;border-radius:12px;padding:12px;background:#dfe6ff;color:#18244d;cursor:pointer}button.active,.primary{background:#344fbd;color:white}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #1d2c6712}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd3eb;border-radius:10px;margin:8px 0}small{color:#657096}.choices{display:grid;gap:9px}h2{margin-top:0}.good{color:#127d50}.bad{color:#bb3b38}a{color:#344fbd} .pill{display:inline-block;background:#edf0ff;border-radius:15px;padding:5px 10px}</style></head><body><header><h1>English Lab</h1><div>Твой английский — в твоём темпе</div></header><nav id="nav"></nav><main id="app"></main><script>
const sections=['Главная','Тест уровня','Слова','Чтение','Грамматика','Произношение','Кино','ChatGPT','Данные'];let tab='Главная';const KEY='english-lab-v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{points:0,answered:0,correct:0,level:'Не определён',words:{},history:[]};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function el(s){document.getElementById('app').innerHTML=s}function log(kind,ok){state.answered++;if(ok)state.correct++;state.points+=ok?10:2;state.history.unshift({date:new Date().toLocaleString('ru-RU'),kind,ok});state.history=state.history.slice(0,100);save()}function render(){document.getElementById('nav').innerHTML=sections.map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('');({ 'Главная':home,'Тест уровня':level,'Слова':words,'Чтение':reading,'Грамматика':grammar,'Произношение':pronunciation,'Кино':cinema,'ChatGPT':chat,'Данные':data})[tab]()}const vocab=[['apple','яблоко'],['journey','путешествие'],['improve','улучшать'],['although','хотя'],['borrow','брать взаймы'],['reliable','надёжный'],['achievement','достижение'],['neighbour','сосед'],['curious','любопытный'],['instead','вместо']];const questions=[['She ___ a student.',['am','is','are'],'is','A1'],['I ___ to work every day.',['go','goes','going'],'go','A1'],['Yesterday we ___ a film.',['watch','watched','watching'],'watched','A2'],['I have lived here ___ 2020.',['for','since','during'],'since','A2'],['If it rains, we ___ home.',['stay','will stay','stayed'],'will stay','B1'],['This book ___ by millions of people.',['has read','has been read','has been reading'],'has been read','B1'],['Had I known, I ___ earlier.',['would leave','would have left','left'],'would have left','B2'],['She insisted that he ___ present.',['is','be','was'],'be','B2']];function home(){el(`<div class="card"><h2>Добро пожаловать!</h2><p>Уровень: <b>${state.level}</b></p><p>Баллы: <b>${state.points}</b> · Выполнено: <b>${state.answered}</b> · Верно: <b>${state.correct}</b></p><p>Слов на повторении: ${Object.values(state.words).filter(x=>!x.known).length}</p><button class="primary" onclick="tab='Тест уровня';render()">Начать с теста</button></div><div class="card"><h2>Как сохраняется прогресс</h2><p>Результаты сохраняются в этом браузере. В разделе «Данные» можно скачать резервную копию и восстановить её.</p></div>`)}let qi=0,score=0;function level(){qi=0;score=0;showQ()}function showQ(){if(qi===questions.length){state.level=score<=2?'A1 (предварительно)':score<=4?'A2 (предварительно)':score<=6?'B1 (предварительно)':'B2 (предварительно)';save();el(`<div class="card"><h2>Результат: ${score}/${questions.length}</h2><p>${state.level}</p><small>Короткий тест оценивает только грамматику и не заменяет полноценную диагностику CEFR.</small><p><button onclick="level()">Повторить</button></p></div>`);return}let q=questions[qi];el(`<div class="card"><span class="pill">Вопрос ${qi+1} из ${questions.length}</span><h2>${q[0]}</h2><div class="choices">${q[1].map((a,i)=>`<button onclick="answerQ(${i})">${a}</button>`).join('')}</div></div>`)}function answerQ(i){let q=questions[qi],ok=q[1][i]===q[2];log('Тест уровня',ok);score+=ok?1:0;qi++;showQ()}
let wi=0;function words(){let [en,ru]=vocab[wi%vocab.length];el(`<div class="card"><h2>Карточки слов</h2><span class="pill">${wi%vocab.length+1} / ${vocab.length}</span><h1>${en}</h1><button onclick="document.getElementById('translation').hidden=false">Показать перевод</button><p id="translation" hidden><b>${ru}</b></p><p><button onclick="rateWord(false)">Повторить позже</button> <button class="primary" onclick="rateWord(true)">Знаю</button></p><button onclick="speak('${en}')">🔊 Произнести</button></div><div class="card"><h2>Мини-игра: выбери перевод</h2><p id="gameword">${en}</p><div class="choices">${[ru,...vocab.filter(x=>x[0]!==en).slice(0,3).map(x=>x[1])].sort((a,b)=>a.localeCompare(b)).map(a=>`<button onclick="gameAnswer('${a.replaceAll("'","\\'")}')">${a}</button>`).join('')}</div><p id="gamefeedback"></p></div>`)}function rateWord(known){let w=vocab[wi%vocab.length][0];state.words[w]={known,updated:new Date().toISOString()};save();wi++;words()}function gameAnswer(a){let ok=a===vocab[wi%vocab.length][1];log('Игра со словами',ok);document.getElementById('gamefeedback').innerHTML=ok?'<span class="good">Верно! +10 баллов</span>':'<span class="bad">Попробуй ещё. Правильный ответ: '+vocab[wi%vocab.length][1]+'</span>'}
const passages=[{title:'A Quiet Morning',level:'A1–A2',text:'Every morning, Anna walks to a small café near her home. She orders tea and reads a book. Today, she meets an old friend. They talk about their plans for the weekend.',q:'What does Anna usually order?',opts:['Coffee','Tea','Juice'],correct:'Tea',translation:'Каждое утро Анна ходит в маленькое кафе рядом с домом. Она заказывает чай и читает книгу. Сегодня она встречает старого друга. Они обсуждают планы на выходные.'},{title:'A Different Route',level:'B1',text:'When Daniel missed his usual train, he decided to walk through an unfamiliar neighbourhood. Along the way, he discovered a tiny bookshop that had been open for more than fifty years. He returned the following Saturday.',q:'Why did Daniel discover the bookshop?',opts:['He missed his train','His friend recommended it','He worked there'],correct:'He missed his train',translation:'Когда Дэниел опоздал на свой обычный поезд, он решил пройти через незнакомый район. По пути он обнаружил маленький книжный магазин, который работал более пятидесяти лет. Он вернулся туда в следующую субботу.'}];let ri=0;function reading(){let p=passages[ri];el(`<div class="card"><span class="pill">${p.level}</span><h2>${p.title}</h2><p style="line-height:1.8">${p.text}</p><button onclick="document.getElementById('trans').hidden=false">Показать перевод</button><p id="trans" hidden>${p.translation}</p><h3>${p.q}</h3><div class="choices">${p.opts.map(a=>`<button onclick="readAnswer('${a}')">${a}</button>`).join('')}</div><p id="readfeedback"></p><p><button onclick="ri=(ri+1)%passages.length;reading()">Следующий текст</button></p></div>`)}function readAnswer(a){let ok=a===passages[ri].correct;log('Чтение',ok);document.getElementById('readfeedback').textContent=ok?'Верно!':'Правильный ответ: '+passages[ri].correct}
const lessons=[['Present Simple','Для привычек и регулярных действий. С he/she/it обычно добавляем -s.','She ___ English every day.',['study','studies','studying'],'studies'],['Past Simple','Для завершённых событий в прошлом. У правильных глаголов окончание -ed.','We ___ yesterday.',['worked','work','working'],'worked'],['Present Perfect','Для опыта или результата, связанного с настоящим. Have/has + третья форма глагола.','I have ___ this film.',['see','saw','seen'],'seen']];let gi=0;function grammar(){let l=lessons[gi];el(`<div class="card"><h2>${l[0]}</h2><p>${l[1]}</p><h3>${l[2]}</h3><div class="choices">${l[3].map(a=>`<button onclick="grammarAnswer('${a}')">${a}</button>`).join('')}</div><p id="gramfeedback"></p><p><button onclick="gi=(gi+1)%lessons.length;grammar()">Следующая тема</button></p></div>`)}function grammarAnswer(a){let ok=a===lessons[gi][4];log('Грамматика',ok);document.getElementById('gramfeedback').textContent=ok?'Верно!':'Правильный ответ: '+lessons[gi][4]}
const sounds=[['/θ/','think','Кончик языка слегка между зубами, выдох без голоса.'],['/ð/','this','То же положение языка, но с голосом.'],['/w/','water','Округли губы и быстро перейди к следующему звуку.'],['/æ/','cat','Открой рот шире, чем для русского «э».'],['/ɪ/','ship','Короткий расслабленный гласный, не такой как долгий /iː/.']];let si=0;function speak(word){if(!('speechSynthesis'in window)){alert('Синтез речи недоступен');return}let u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u)}function pronunciation(){let s=sounds[si];el(`<div class="card"><h2>Звук ${s[0]}</h2><h1>${s[1]}</h1><p>${s[2]}</p><button class="primary" onclick="speak('${s[1]}')">🔊 Послушать</button><p><small>Повтори вслух и сравни с образцом. Автоматической оценки произношения пока нет.</small></p><button onclick="si=(si+1)%sounds.length;pronunciation()">Следующий звук</button></div>`)}function cinema(){el(`<div class="card"><h2>Кино и аудирование</h2><p>В первой версии — ссылки на открытые официальные учебные видеоматериалы. Сами видео не копируются и не распространяются приложением.</p><p><a href="https://learnenglish.britishcouncil.org/general-english/video-zone" target="_blank" rel="noopener">British Council — Video zone ↗</a></p><p><a href="https://www.bbc.co.uk/learningenglish" target="_blank" rel="noopener">BBC Learning English ↗</a></p><small>Фрагменты художественных фильмов добавим после проверки прав и доступности конкретных источников.</small></div>`)}function chat(){let prompt=`Ты мой преподаватель английского. Мой предварительный уровень: ${state.level}. Выполнено заданий: ${state.answered}, правильных: ${state.correct}. Слова для повторения: ${Object.entries(state.words).filter(([k,v])=>!v.known).map(([k])=>k).join(', ')||'пока нет'}. Дай мне короткое персональное упражнение. В конце выдай блок JSON между маркерами ENGLISH_LAB_START и ENGLISH_LAB_END с полями summary (строка), newWords (массив строк), recommendation (строка).`;el(`<div class="card"><h2>ChatGPT-преподаватель</h2><p>Скопируй запрос, открой ChatGPT и вставь его. Затем скопируй структурированный результат сюда.</p><textarea id="prompt" rows="7" readonly></textarea><button class="primary" onclick="navigator.clipboard.writeText(document.getElementById('prompt').value).then(()=>alert('Запрос скопирован'))">Копировать запрос</button> <a href="https://chatgpt.com/" target="_blank" rel="noopener">Открыть ChatGPT ↗</a></div><div class="card"><h2>Импорт ответа</h2><textarea id="response" rows="7" placeholder="Вставь сюда ответ с блоком ENGLISH_LAB_START ... ENGLISH_LAB_END"></textarea><button onclick="importAI()">Сохранить результат</button><p id="importfeedback"></p></div>`);document.getElementById('prompt').value=prompt}function importAI(){try{let raw=document.getElementById('response').value;let match=raw.match(/ENGLISH_LAB_START\s*([\s\S]*?)\s*ENGLISH_LAB_END/);if(!match)throw Error('Не найдены маркеры');let obj=JSON.parse(match[1]);if(typeof obj.summary!=='string'||!Array.isArray(obj.newWords)||typeof obj.recommendation!=='string')throw Error('Неверная структура');state.history.unshift({date:new Date().toLocaleString('ru-RU'),kind:'ChatGPT: '+obj.summary.slice(0,90),ok:true});obj.newWords.filter(x=>typeof x==='string').slice(0,30).forEach(x=>state.words[x.slice(0,60)]={known:false,updated:new Date().toISOString()});state.lastRecommendation=obj.recommendation.slice(0,500);save();document.getElementById('importfeedback').textContent='Результат сохранён. Рекомендация: '+state.lastRecommendation}catch(e){document.getElementById('importfeedback').textContent='Не удалось импортировать: '+e.message}}
function data(){el(`<div class="card"><h2>Резервная копия</h2><p>Скачай прогресс в JSON. Файл можно загрузить на другом устройстве или после переустановки.</p><button class="primary" onclick="backup()">Скачать прогресс</button><input type="file" id="restore" accept="application/json,.json"><button onclick="restore()">Восстановить из файла</button></div><div class="card"><h2>Последние занятия</h2>${state.history.slice(0,15).map(x=>`<p>${x.date} — ${String(x.kind).replaceAll('<','&lt;')} ${x.ok?'✓':'×'}</p>`).join('')||'Пока нет занятий'}</div>`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='english-lab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(){let f=document.getElementById('restore').files[0];if(!f)return alert('Выбери файл');try{let x=JSON.parse(await f.text());if(typeof x.points!=='number'||!Array.isArray(x.history)||typeof x.words!=='object'||x.words===null)throw Error('Неверный файл');if(!confirm('Заменить текущий прогресс данными из файла?'))return;state=x;save();render()}catch(e){alert('Ошибка восстановления: '+e.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
